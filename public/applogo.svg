<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0D0D0D" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Wire/connection lines -->
  <path d="M20 32 L28 20 L36 44 L44 32" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M16 32 L20 32" stroke="#39FF14" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M44 32 L48 32" stroke="#39FF14" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Connection nodes -->
  <circle cx="20" cy="32" r="3" fill="#D4AF37"/>
  <circle cx="28" cy="20" r="3" fill="#D4AF37"/>
  <circle cx="36" cy="44" r="3" fill="#D4AF37"/>
  <circle cx="44" cy="32" r="3" fill="#D4AF37"/>
  
  <!-- Glowing dot -->
  <circle cx="32" cy="32" r="4" fill="#39FF14">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>